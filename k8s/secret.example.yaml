# Template only. NOT included in kustomization.yaml; do not commit real values.
# Create the real secret with:
#   kubectl -n eventpulse create secret generic eventpulse-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/eventpulse?sslmode=require' \
#     --from-literal=REDIS_URL='redis://:pass@host:6379/0' \
#     --from-literal=API_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: eventpulse-secrets
  namespace: eventpulse
type: Opaque
stringData:
  DATABASE_URL: postgres://CHANGE_ME
  REDIS_URL: redis://CHANGE_ME:6379/0
  API_KEY: CHANGE_ME
